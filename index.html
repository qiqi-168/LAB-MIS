.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}

table{width:100%;border-collapse:collapse;}
th{background:#eef3f9;color:#39506b;font-weight:normal;text-align:left;padding:9px 10px;font-size:12.5px;border-bottom:1.5px solid #dbe4ee;}

function sdsOf(it){var h='<b>SDS 安全技术说明书 — '+esc(it.name)+'</b><br>';if(it.risk==='red')return h+'危险性：剧毒/易制爆/易燃易爆（红色最高级）<br>防护：双人同时在场，全套PPE，管控区限量取用。<br>泄漏：立即疏散，切断火源，联系专管员按应急预案处置。';if(it.risk==='yellow')return h+'危险性：腐蚀性/有毒有害（黄色中高级）<br>防护：通风橱内操作；防酸碱手套、护目镜或面罩。<br>皮肤接触：清水冲洗15分钟以上并就医。';return h+'危险性：常规低风险（蓝色普通级）<br>使用：按SOP使用即可。';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* 物品实时显示状态：融合借用状态 */
function dispStatus(it){
  if(it.status==='报废')return '报废';
  if(it.status==='过期')return '过期';
  if(it.status==='待修')return '待修';
  var bs=borrowsOf(it.id);
  var hasPending=bs.some(function(b){return b.status==='pending';});
  var hasActive=bs.some(function(b){return b.status==='approved'||b.status==='active';});
  if(hasActive&&hasPending)return '借用中(审批中)';
  if(hasActive)return '借用中';
  if(hasPending)return '借用中(审批中)';
  return '在库';
}
function stTag(s){
  if(s.indexOf('借用')>=0)return '<span class="tag borrowing">'+s+'</span>';
  if(s==='在库')return '<span class="tag green">'+s+'</span>';
  if(s==='待修')return '<span class="tag yellow">'+s+'</span>';
  if(s==='报废'||s==='过期')return '<span class="tag red">'+s+'</span>';
  return '<span class="tag gray">'+s+'</span>';
}
function riskTag(r){return '<span class="tag '+r+'">'+RISK_TXT[r]+'</span>';}
function bPill(b){var od=b.status==='active'&&diffDay(b.end)>0;if(od)return '<span class="pill overdue">逾期未还</span>';var m={pending:['pending','待审批'],approved:['approved','审批通过'],active:['active','使用中'],returned:['returned','已归还'],rejected:['rejected','已拒绝']};var c=m[b.status];return '<span class="pill '+c[0]+'">'+c[1]+'</span>';}

  var b=db.borrows.filter(function(x){return x.id===document.querySelector('#mBox h3').textContent.split('·')[1].trim();})[0];

    '<div class="form-section"><h4>使用后剩余量归还确认（管理员+复核人再次双签）</h4>'+
    '<div class="sig-row"><b>结余：</b>'+esc(h.remain)+'</div>'+
    '<div class="sig-row"><b>归还 · 发放人签字：</b>'+(h.returnIssuerSigner?'<span class="sig sig-done">已签：'+esc(h.returnIssuerSigner)+'</span>':(canRet?'<button class="btn mini primary" onclick="retSign(\''+hid+'\')">'+esc(cur.name)+' 签</button>':'<span class="sig sig-pending">待签</span>'))+'</div>'+
    '<div class="sig-row"><b>归还 · 复核人签字：</b>'+(h.returnRecheckSigner?'<span class="sig sig-done">已签：'+esc(h.returnRecheckSigner)+'</span>':'<span class="sig sig-pending">待签</span>')+'</div></div>',
    can());
}
function retSign(hid){var h=db.handovers.filter(function(x){return x.id===hid;})[0];if(h.returnIssuerSigner){h.returnRecheckSigner=cur.name;}else{h.returnIssuerSigner=cur.name;}h.returnTime=dtStr();if(h.returnIssuerSigner&&h.returnRecheckSigner)h.status='returned';logAct('在双人收发表'+hid+'签署归还双签','双人管控');saveDB();closeModal();openHandover(hid);}

/* =====================================================
   C. 设备维护工程师
===================================================== */
function vEquip(){
  var eq=db.items.filter(function(i){return i.cat==='仪器';});
  return '<div class="card"><h2>设备台账</h2><div class="sub">大型精密仪器校准/报修/强制停用 · 点击名称查看借用明细</div>'+
  '<table><thead><tr><th>编号</th><th>名称</th><th>规格</th><th>购入日</th><th>检定周期</th><th>实时状态</th><th>操作</th></tr></thead><tbody>'+
  eq.map(function(i){return '<tr><td>'+esc(i.id)+'</td><td><span class="item-name" onclick="openItemDetail(\''+i.id+'\')">'+esc(i.name)+'</span></td><td>'+esc(i.spec)+'</td><td>'+esc(i.purchaseDate||'-')+'</td><td>'+(i.expire||'-')+'</td><td>'+stTag(dispStatus(i))+'</td><td><button class="btn mini" onclick="engRepair(\''+i.id+'\')">报修</button><button class="btn mini danger" onclick="engStop(\''+i.id+'\')">强制停用</button></td></tr>';}).join('')+'</tbody></table></div>';
}
function engRepair(id){var it=itemBy(id);showModal('<h3>报修登记 — '+esc(it.name)+'</h3><div class="frm"><label>故障描述 *</label><textarea id="er_desc" rows="3"></textarea></div>','<button class="btn primary" onclick="saveEngRepair(\''+id+'\')">提交工单</button>'+can());}
function saveEngRepair(id){var d=document.getElementById('er_desc').value.trim();if(!d){toast('请填写故障描述','#e74c3c');return;}var it=itemBy(id);db.repairs.unshift({id:'RP'+today().replace(/-/g,'')+Math.floor(Math.random()*90+10),dev:it.name+'('+it.id+')',desc:d,by:cur.name,time:dtStr(),st:'待处理',engineer:'',finishTime:''});logAct('提交报修工单：'+it.name+' — '+d);saveDB();closeModal();renderShell();toast('工单已提交');}
function engStop(id){var it=itemBy(id);it.status='待修';logAct('对'+it.name+'('+it.id+')行使强制停用权，贴"停用"标识');saveDB();renderShell();toast('已强制停用并贴标');}
function vRepairE(){
  return '<div class="card"><h2>报修工单</h2><div class="sub">待处理工单点击处理</div><table><thead><tr><th>设备</th><th>问题描述</th><th>报修人</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody>'+
  db.repairs.map(function(r,i){return '<tr><td>'+esc(r.dev)+'</td><td>'+esc(r.desc)+'</td><td>'+esc(r.by)+'</td><td>'+r.time+'</td><td>'+(r.st==='待处理'?'<span class="tag yellow">待处理</span>':'<span class="tag green">已修复</span>')+'</td><td>'+(r.st==='待处理'?'<button class="btn mini primary" onclick="fixRepair('+i+')">标记已修复</button>':'-')+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function fixRepair(i){db.repairs[i].st='已修复';db.repairs[i].engineer=cur.name;db.repairs[i].finishTime=dtStr();logAct('完成报修工单闭环：'+db.repairs[i].dev);saveDB();renderShell();toast('已标记修复');}

/* =====================================================
   D. 借用人
===================================================== */
function vApply(){
  return '<div class="card"><h2>申请借用</h2><div class="sub">搜索物品 → 填写申请表 → 阅读SDS → 签安全声明 → 提交</div>'+
  '<div class="toolbar"><input id="ap_kw" placeholder="输入物品名搜索…" onkeyup="apSearch()" style="width:320px;"></div><div id="ap_list"></div><div id="ap_form"></div>';
}
function apSearch(){
  var kw=document.getElementById('ap_kw').value.trim().toLowerCase();
  var box=document.getElementById('ap_list');if(!kw){box.innerHTML='';apPpeEcho('');return;}
  var hits=db.items.filter(function(i){return (i.name+i.spec).toLowerCase().indexOf(kw)>=0;});
  box.innerHTML=hits.length?'<table><thead><tr><th>编号</th><th>名称</th><th>风险</th><th>可用量</th><th>状态</th><th></th></tr></thead><tbody>'+hits.map(function(i){return '<tr><td>'+esc(i.id)+'</td><td><span class="item-name" onclick="openItemDetail(\''+i.id+'\')">'+esc(i.name)+'</span><br><span class="muted">'+esc(i.spec)+'</span></td><td>'+riskTag(i.risk)+'</td><td>'+i.stock+' '+esc(i.unit)+'</td><td>'+stTag(dispStatus(i))+'</td><td><button class="btn mini primary" onclick="pickItem(\''+i.id+'\')">选择并申请</button></td></tr>';}).join('')+'</tbody></table>':'<div class="muted" style="padding:18px;text-align:center;">无匹配物品</div>';
  apPpeEcho(document.getElementById('ap_kw').value);
}
function apPpeEcho(kw){
  var f=document.getElementById('ap_form');var old=document.getElementById('ppe_echo');if(old)old.remove();
  var hit=null;Object.keys(PPE_MAP).forEach(function(k){if(kw.indexOf(k)>=0)hit=PPE_MAP[k];});
  if(hit){var dv=document.createElement('div');dv.className='notice-red';dv.id='ppe_echo';dv.textContent='风险联动提示：'+hit;f.appendChild(dv);}
}
var _sel=null,_sdsRead=false;
function pickItem(id){
  var it=itemBy(id);_sel=it;_sdsRead=false;
  var hint=ppeHint(it);
  document.getElementById('ap_form').innerHTML='<div class="card" style="border-left:5px solid #2a78b8;"><h2>借用申请表 — '+esc(it.name)+'</h2><div class="sub">'+esc(it.id)+' · '+esc(it.spec)+' · 在库 '+it.stock+esc(it.unit)+(hint?'<div class="notice-red">PPE 提示：'+hint+'</div>':'')+'</div><div class="frm">'+
    '<div class="row2"><div><label>借用项目名称 <span class="req">*</span></label><input id="bf_proj" placeholder="课题名称"></div><div><label>数量 <span class="req">*</span></label><input id="bf_qty" value="1'+esc(it.unit)+'"></div></div>'+
    '<div class="row2"><div><label>开始日期 <span class="req">*</span></label><input id="bf_s" type="date" value="'+today()+'"></div><div><label>归还日期 <span class="req">*</span></label><input id="bf_e" type="date" value="'+addDays(today(),3)+'"></div></div>'+
    '<label>借用物品清单</label><textarea id="bf_list" rows="2">1. '+esc(it.name)+' / '+esc(it.spec)+' / <span id="bf_qty2">1'+esc(it.unit)+'</span></textarea>'+
    '<div><button class="btn ghost" onclick="openSDS()">阅读 SDS 安全说明书</button> <span id="sds_line" class="muted">未阅读，不能提交</span></div>'+
    '<div class="sig-row"><b>借用人签字(安全声明)：</b>'+(cur?'<button class="btn mini primary" id="bf_sig" onclick="signApply()" disabled>点击签名</button> <span class="sig sig-pending">待签</span>':'')+'</div>'+
  '</div><div class="m-foot"><button class="btn primary" id="bf_sub" onclick="submitApply(\''+id+'\')" disabled>提交申请</button></div></div>';
}
function openSDS(){showModal('<h3>SDS 安全技术说明书</h3><div class="sds-box">'+sdsOf(_sel)+'</div><div class="chk-line"><input type="checkbox" id="sds_chk" onchange="sdsRead(this.checked)"><label for="sds_chk" style="margin:0;cursor:pointer;">我已阅读，承诺全程合规</label></div>',can());}
function sdsRead(v){_sdsRead=v;var ln=document.getElementById('sds_line');if(ln)ln.innerHTML=v?'<span class="tag green">已阅读</span>':'未阅读，不能提交';var sg=document.getElementById('bf_sig');if(sg)sg.disabled=!v;subState();}
function signApply(){var btn=document.getElementById('bf_sig');btn.outerHTML='<span class="sig sig-done">已签：'+cur.name+' @ '+nowStr()+'</span>';_applySigned=true;subState();}
var _applySigned=false;
function subState(){var ok=_sdsRead&&_applySigned&&document.getElementById('bf_proj').value.trim()&&document.getElementById('bf_qty').value&&document.getElementById('bf_s').value&&document.getElementById('bf_e').value;var b=document.getElementById('bf_sub');if(b)b.disabled=!ok;}
document.addEventListener('input',function(ev){if(ev.target.closest&&ev.target.closest('#ap_form'))subState();});
function submitApply(id){
  var it=itemBy(id);var proj=document.getElementById('bf_proj').value.trim(),q=document.getElementById('bf_qty').value.trim(),s=document.getElementById('bf_s').value,e=document.getElementById('bf_e').value;
  if(!proj){toast('请填写项目名称','#e74c3c');return;}if(new Date(e)<new Date(s)){toast('归还日期不能早于开始','#e74c3c');return;}
  var bid='BR'+today().replace(/-/g,'')+Math.floor(Math.random()*900+100);
  db.borrows.unshift({id:bid,borrowerId:cur.id,borrowerName:cur.name,project:proj,start:s,end:e,list:[{name:it.name,spec:it.spec,qty:q}],sdsSigned:true,sdsSignTime:dtStr(),sdsSigner:cur.name,adminOpinion:'',adminReason:'',adminSigner:'',adminSignTime:'',handoverNote:'',returnDate:'',returnStatus:'',returnSigner:'',returnAdminSigner:'',returnTime:'',status:'pending',createTime:dtStr()});
  logAct('提交借用申请：'+it.name+' '+q+'（'+s+' 至 '+e+'），项目：'+proj+'，已签署安全声明');_applySigned=false;
  saveDB();toast('申请已提交，等待管理员审批');document.getElementById('ap_form').innerHTML='';navTab.borrower='records';renderShell();
}
function vRecords(){
  return '<div class="card"><h2>借用记录</h2><div class="sub">全部借用单 · 含审批通过状态 · 可查看他人记录 · 我的单据高亮</div>'+
  '<table><thead><tr><th>单号</th><th>借用人</th><th>物品</th><th>项目</th><th>拟用区间</th><th>状态</th><th></th></tr></thead><tbody>'+
  db.borrows.map(function(b){var mine=b.borrowerId===cur.id;return '<tr'+(mine?' style="background:#f0f7ff;"':'')+(b.status==='active'&&diffDay(b.end)>0?' class="row-overdue"':'')+'><td>'+esc(b.id)+'</td><td>'+esc(b.borrowerName)+(mine?' (我)':'')+'</td><td>'+esc(b.list[0].name)+' '+esc(b.list[0].qty)+'</td><td>'+esc(b.project)+'</td><td>'+b.start+' ~ '+b.end+'</td><td>'+bPill(b)+'</td><td><button class="btn mini" onclick="openBorrowForm(\''+b.id+'\')">查看申请表</button></td></tr>';}).join('')+'</tbody></table></div>';
}

route();
</script>
</body>
</html>
