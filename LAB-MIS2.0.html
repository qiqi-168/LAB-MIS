<html lang="zh-CN">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#f0f3f8;color:#2c3e50;font-size:14px;padding-bottom:56px;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid #ccd5e0;border-radius:5px;outline:none;background:#fff;}
input:focus,select:focus{border-color:#3478c6;}
a{color:#2a78b8;text-decoration:none;cursor:pointer;}
a:hover{text-decoration:underline;}
/* 登录 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#12395f 0%,#1d5a8f 55%,#2a78b8 100%);padding:30px;}
.login-box{background:#fff;border-radius:12px;padding:32px 36px;width:380px;max-width:96vw;box-shadow:0 18px 50px rgba(0,0,0,.35);}
.login-box h1{font-size:24px;color:#12395f;text-align:center;margin-bottom:4px;letter-spacing:1px;}
.login-box .lg-sub{text-align:center;color:#8896ab;font-size:12.5px;margin-bottom:22px;}
.login-box label{display:block;font-size:12.5px;color:#5a6c82;margin:14px 0 5px;font-weight:bold;}
.login-box .lg-err{color:#e74c3c;font-size:12.5px;margin-top:10px;min-height:18px;}
.login-box .btn{width:100%;margin-top:18px;}
.lg-hint{margin-top:16px;padding:10px 12px;background:#f6f9fd;border:1px dashed #cfdcec;border-radius:6px;font-size:11.5px;color:#7a8aa0;line-height:1.85;}
.lg-hint b{color:#3a5878;}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;height:54px;background:#12395f;color:#fff;display:flex;align-items:center;padding:0 22px;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.topbar .brand{font-size:17px;font-weight:bold;letter-spacing:1px;}
.nav-tabs{display:flex;gap:4px;margin-left:14px;flex:1;}
.nav-tabs button{background:none;border:none;color:#bcd4ea;padding:8px 14px;border-radius:6px;font-size:13.5px;}
.nav-tabs button:hover{background:rgba(255,255,255,.12);color:#fff;}
.nav-tabs button.on{background:#2a78b8;color:#fff;}
.todo-badge{position:relative;cursor:pointer;user-select:none;padding:6px 10px;border-radius:6px;}
.todo-badge:hover{background:rgba(255,255,255,.12);}
.todo-badge i{position:absolute;top:0;right:0;background:#e74c3c;color:#fff;font-style:normal;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px;padding:0 3px;}
.user-area{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;}
.btn-out{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:4px 12px;font-size:12px;}
.btn-out:hover{background:rgba(255,255,255,.15);}
/* 主体 */
.page{max-width:1200px;margin:22px auto 90px;padding:0 18px;}
.card{background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 2px 10px rgba(30,60,100,.07);margin-bottom:18px;}
.card h2{font-size:17px;color:#12395f;margin-bottom:4px;}
.card .sub{font-size:12px;color:#93a0b3;margin-bottom:14px;}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.toolbar .grow{flex:1;}
table{width:100%;border-collapse:collapse;}
th{background:#eef3f9;color:#39506b;font-weight:normal;text-align:left;padding:9px 10px;font-size:12.5px;border-bottom:1.5px solid #dbe4ee;}
td{padding:9px 10px;border-bottom:1px solid #edf1f6;font-size:13px;vertical-align:middle;}
tr:hover td{background:#f7fafd;}
.item-name{color:#2a78b8;cursor:pointer;}
.item-name:hover{text-decoration:underline;}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;white-space:nowrap;}
.tag.red{background:#fdecea;color:#c0392b;}
.tag.yellow{background:#fef5e7;color:#b9770e;}
.tag.blue{background:#eaf3fc;color:#216aa2;}
.tag.green{background:#eafaf1;color:#1e8449;}
.tag.gray{background:#eceff3;color:#657180;}
.tag.borrow{background:#eaf3fc;color:#216aa2;}
.tag.borrowing{background:#e8e0f5;color:#6c3aa7;}
.btn{border:none;border-radius:6px;padding:8px 16px;font-size:13px;background:#eef4fa;color:#2c5d8f;border:1px solid #cfdded;}
.btn:hover{background:#dcebfa;}
.btn.primary{background:#2a78b8;color:#fff;border:none;}
.btn.primary:hover{background:#20669e;}
.btn.big{padding:11px 26px;font-size:14.5px;font-weight:bold;}
.btn.danger{background:#e74c3c;color:#fff;border:none;}
.btn.danger:hover{background:#cf2f23;}
.btn.ghost{background:none;border:1px solid #c6d2de;color:#48607a;padding:6px 12px;font-size:12px;border-radius:5px;}
.btn.ghost:hover{border-color:#2a78b8;color:#2a78b8;}
.btn.mini{padding:3px 10px;font-size:11.5px;border-radius:4px;}
.btn[disabled]{background:#cfd8e3;color:#fff;border:none;cursor:not-allowed;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px;}
.kpi{background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 10px rgba(30,60,100,.07);}
.kpi .k-label{font-size:12.5px;color:#8896ab;margin-bottom:8px;}
.kpi .k-val{font-size:28px;font-weight:bold;color:#12395f;}
.kpi.alert .k-val{color:#c0392b;}
/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(15,35,60,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:12px;width:620px;max-width:96vw;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.modal.wide{width:780px;}
.modal h3{font-size:16px;color:#12395f;margin-bottom:16px;}
.frm label{display:block;font-size:12.5px;color:#5a6c82;margin:12px 0 5px;font-weight:bold;}
.frm label .req{color:#e74c3c;}
.frm .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.frm input,.frm select,.frm textarea{width:100%;}
.notice-red{background:#fdf0ef;border:1px solid #f5c6c0;color:#c0392b;font-weight:bold;padding:10px 13px;border-radius:6px;margin-top:10px;font-size:12.8px;line-height:1.6;}
.sds-box{background:#f6f9fd;border:1px solid #d8e4f0;border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.7;color:#41546d;max-height:180px;overflow:auto;margin-top:10px;}
.chk-line{margin-top:10px;font-size:13px;display:flex;gap:7px;align-items:center;}
.date-chip,.slot-chip{border:1.5px solid #d5deea;border-radius:7px;padding:7px 12px;font-size:12.5px;text-align:center;cursor:pointer;user-select:none;background:#fbfcfe;line-height:1.5;}
.date-chip.on,.slot-chip.on{border-color:#2a78b8;background:#e8f2fb;color:#1d5a8f;font-weight:bold;}
.slot-chip.full{border-color:#eecfcf;background:#fdf3f3;color:#c0392b;cursor:not-allowed;opacity:.8;}
.m-foot{margin-top:20px;display:flex;justify-content:flex-end;gap:10px;}
/* 签名块 */
.sig{display:inline-block;padding:6px 12px;border-radius:6px;font-size:12.5px;margin:3px 6px 3px 0;vertical-align:middle;}
.sig-done{background:#eafaf1;color:#1e8449;border:1px solid #bfe3cd;}
.sig-pending{background:#f6f9fd;color:#7a8aa0;border:1px dashed #c7d2e0;}
.sig-row{margin:8px 0;padding:9px 12px;background:#f8fafc;border-radius:6px;font-size:13px;}
.sig-row b{color:#39506b;display:inline-block;width:108px;}
.form-section{border:1px solid #e3e9f1;border-radius:8px;padding:14px 16px;margin-bottom:14px;}
.form-section h4{font-size:13.5px;color:#12395f;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #eef2f7;}
/* 底部日志 */
.logbar{position:fixed;left:0;right:0;bottom:0;height:42px;background:#10263d;color:#9db6cd;display:flex;align-items:center;padding:0 20px;gap:14px;font-size:12px;z-index:10;pointer-events:auto;}
.logbar b{color:#cfe3f5;font-weight:normal;}
.logbar button{background:none;border:none;color:#7fc0bb;font-size:12px;text-decoration:underline;}
.lg-tag{background:#e74c3c;color:#fff;padding:1px 8px;border-radius:9px;font-size:10.5px;}
.lowstock-banner{background:#e74c3c;color:#fff;border-radius:8px;padding:11px 16px;margin-bottom:16px;font-size:13px;box-shadow:0 4px 14px rgba(231,76,60,.35);}
.toast{position:fixed;top:70px;right:24px;background:#12395f;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .25s;}
@keyframes tin{from{transform:translateX(40px);opacity:0;}to{transform:none;opacity:1;}}
.muted{color:#94a2b5;font-size:12px;}
.row-overdue td{background:#fdf0ef!important;}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;}
.pill.pending{background:#eaf3fc;color:#216aa2;}
.pill.approved{background:#e8e0f5;color:#6c3aa7;}
.pill.active{background:#eafaf1;color:#1e8449;}
.pill.returned{background:#eceff3;color:#657180;}
.pill.rejected{background:#fdecea;color:#c0392b;}
.pill.overdue{background:#e74c3c;color:#fff;}
.divider{height:1px;background:#e3e9f1;margin:14px 0;}
/* ===== 移动端响应式 ===== */
@media(max-width:768px){
  body{font-size:13px;padding-bottom:50px;}
  /* 顶栏 */
  .topbar{height:48px;padding:0 10px;gap:8px;}
  .topbar .brand{font-size:15px;letter-spacing:0;}
  .nav-tabs{margin-left:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .nav-tabs::-webkit-scrollbar{display:none;}
  .nav-tabs button{padding:6px 10px;font-size:12px;white-space:nowrap;flex-shrink:0;}
  .todo-badge{padding:5px 8px;}
  .user-area{gap:8px;font-size:12px;}
  .btn-out{padding:3px 8px;font-size:11px;}
  /* 主体 */
  .page{max-width:100%;margin:12px auto 70px;padding:0 10px;}
  .card{padding:12px 14px;border-radius:8px;margin-bottom:12px;}
  .card h2{font-size:15px;}
  .card .sub{font-size:11px;margin-bottom:10px;}
  /* 工具栏 */
  .toolbar{gap:6px;margin-bottom:10px;}
  .btn{padding:6px 12px;font-size:12px;}
  .btn.big{padding:9px 18px;font-size:13px;}
  .btn.mini{padding:3px 8px;font-size:11px;}
  /* KPI */
  .kpi-row{grid-template-columns:1fr;gap:10px;margin-bottom:12px;}
  .kpi{padding:12px;border-radius:8px;}
  .kpi .k-val{font-size:22px;}
  .kpi .k-label{font-size:11.5px;}
  /* 表格滚动 */
  .card table,.form-section table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
  th,td{padding:7px 8px;font-size:12px;}
  th{font-size:11.5px;}
  /* 弹窗 */
  .overlay{padding:0;}
  .modal{width:100%!important;max-width:100%!important;max-height:100vh;border-radius:0;padding:14px 12px;}
  .modal h3{font-size:14px;margin-bottom:10px;}
  .m-foot{justify-content:stretch;gap:8px;}
  .m-foot .btn{flex:1;padding:8px 6px;font-size:12px;}
  /* 表单 */
  .frm .row2{grid-template-columns:1fr;gap:0;}
  .frm label{font-size:12px;margin:10px 0 4px;}
  .frm input,.frm select,.frm textarea{font-size:13px;padding:8px 8px;}
  /* 签名块 */
  .sig-row{padding:7px 10px;font-size:12px;}
  .sig-row b{width:auto;display:block;margin-bottom:3px;}
  .sig{font-size:11.5px;padding:5px 8px;}
  .form-section{padding:10px 12px;margin-bottom:10px;}
  .form-section h4{font-size:12.5px;}
  /* 底栏 */
  .logbar{height:36px;padding:0 10px;gap:8px;font-size:11px;}
  .logbar b{font-size:11px;}
  /* 低库存横幅 */
  .lowstock-banner{padding:8px 12px;font-size:12px;border-radius:6px;}
  /* toast */
  .toast{top:54px;right:10px;left:10px;padding:10px 14px;font-size:12px;border-radius:6px;text-align:center;}
  /* 日期/时段选择 chip */
  .date-chip,.slot-chip{padding:6px 8px;font-size:11.5px;}
  /* SVG 图表宽度自适应 */
  .form-section svg{max-width:100%;height:auto;}
  /* 登录 */
  .login-wrap{padding:16px;}
  .login-box{padding:24px 20px;width:100%;border-radius:8px;}
  .login-box h1{font-size:20px;}
  .lg-hint{font-size:10.5px;padding:8px 10px;line-height:1.7;}
}
@media(max-width:380px){
  .topbar .brand{font-size:13px;}
  .nav-tabs button{padding:5px 7px;font-size:11px;}
  .card{padding:10px 11px;}
  .kpi .k-val{font-size:18px;}
}
</style>

<script>
/* =====================================================

var DBKEY='labmis_db_v2';
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function p2(n){return n<10?'0'+n:''+n;}
function nowStr(){var d=new Date();return p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());}
function dtStr(){return today()+' '+p2(new Date().getHours())+':'+p2(new Date().getMinutes());}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function diffDay(iso){var a=new Date(iso+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.floor((b-a)/86400000);}
/* 生成近90天历史仪器预约数据（确定性伪随机，供使用分析图表展示） */
function genRes(){
  var rnd=(function(){var s=20260827;return function(){s=(s*9301+49297)%233280;return s/233280;};})();
  var devs=[{id:'YQ-001',name:'气相色谱仪GC-2014C',w:0.55,cap:1},
            {id:'YQ-002',name:'高速冷冻离心机',w:0.5,cap:2},
            {id:'YQ-003',name:'PCR扩增仪',w:0.22,cap:1},
            {id:'YQ-004',name:'紫外可见分光光度计',w:0.6,cap:1},
            {id:'YQ-005',name:'酶标仪',w:0.06,cap:1}];
  var us=[['u6','王芳',0.4],['u4','张雨欣',0.3],['u5','李明',0.2],['u3','王建国',0.1]];
  var slots=['上午 8:00-12:00','下午 13:00-17:00','晚上 18:00-22:00'];
  var projs=['纳米纤维支架制备','蛋白质二级结构FTIR分析','OP-I经皮递送载体研究','pH梯度洗脱层析','土壤重金属消解','水质COD测定','细胞培养与传代','PCR扩增检测'];
  var out=[],n=1;
  for(var d=90;d>=1;d--){
    var date=addDays(today(),-d);
    var cnt=rnd()<0.72?1+Math.floor(rnd()*3):0;
    for(var k=0;k<cnt;k++){
      var r=rnd(),acc=0,dev=devs[0];
      for(var i=0;i<devs.length;i++){acc+=devs[i].w;if(r<=acc){dev=devs[i];break;}}
      if(dev.id==='YQ-003'&&d<12)continue;
      var ru=rnd(),u=us[0];acc=0;
      for(i=0;i<us.length;i++){acc+=us[i][2];if(ru<=acc){u=us[i];break;}}
      var sl=[],sn=1+Math.floor(rnd()*2);
      var pool=slots.slice();
      for(i=0;i<sn&&pool.length;i++){var si=Math.floor(rnd()*pool.length);sl.push(pool.splice(si,1)[0]);}
      var st=rnd()<0.94?'done':'canceled';
      out.push({id:'RQ'+(1000+n),devId:dev.id,devName:dev.name,userId:u[0],userName:u[1],
        project:projs[Math.floor(rnd()*projs.length)],date:date,slots:sl,hours:sl.length*4,
        samples:(1+Math.floor(rnd()*20))+'个样品',note:'',status:st,
        applyTime:date+' 09:00',signer:u[1],signTime:date+' 09:05',
        approveSigner:'刘敏',approveTime:date+' 10:00',adminOpinion:'同意',adminReason:'',
        checkinTime:st==='done'?date+' 08:30':'',checkoutTime:st==='done'?date+' '+(16+Math.floor(rnd()*4))+':30':'',
        actualHours:st==='done'?sl.length*4:0});
      n++;
    }
  }
  var fut=[[1,'YQ-001','气相色谱仪GC-2014C','u4','张雨欣','pending','蛋白质二级结构FTIR分析'],
           [2,'YQ-002','高速冷冻离心机','u5','李明','approved','细胞培养与传代'],
           [1,'YQ-004','紫外可见分光光度计','u6','王芳','pending','水质COD测定']];
  fut.forEach(function(f,i){
    out.push({id:'RQF'+(100+i),devId:f[1],devName:f[2],userId:f[3],userName:f[4],project:f[6],
      date:addDays(today(),f[0]),slots:['下午 13:00-17:00'],hours:4,samples:'6个样品',note:'',status:f[5],
      applyTime:today()+' 09:00',signer:f[4],signTime:today()+' 09:05',
      approveSigner:f[5]==='approved'?'刘敏':'',approveTime:f[5]==='approved'?today()+' 10:00':'',adminOpinion:f[5]==='approved'?'同意':'',adminReason:'',
      checkinTime:'',checkoutTime:'',actualHours:0});
  });
  return out;
}

/* 物品实时显示状态：融合借用/预约状态 */
function dispStatus(it){
  if(it.status==='报废')return '报废';
  if(it.status==='过期')return '过期';
  if(it.status==='待修')return '待修';
  if(it.cat==='仪器'){
    var rs=db.res.filter(function(r){return r.devId===it.id;});
    if(rs.some(function(r){return r.status==='using';}))return '借用中';
    if(rs.some(function(r){return r.status==='pending';}))return '借用中(审批中)';
    if(rs.some(function(r){return r.status==='approved';}))return '已预约';
    return '在库';
  }
  var bs=borrowsOf(it.id);
  var hasPending=bs.some(function(b){return b.status==='pending';});
  var hasActive=bs.some(function(b){return b.status==='approved'||b.status==='active';});
  if(hasActive&&hasPending)return '借用中(审批中)';
  if(hasActive)return '借用中';
  if(hasPending)return '借用中(审批中)';
  return '在库';
}
function stTag(s){
  if(s==='已预约')return '<span class="tag blue">'+s+'</span>';
  if(s.indexOf('借用')>=0)return '<span class="tag borrowing">'+s+'</span>';
  if(s==='在库')return '<span class="tag green">'+s+'</span>';
  if(s==='待修')return '<span class="tag yellow">'+s+'</span>';
  if(s==='报废'||s==='过期')return '<span class="tag red">'+s+'</span>';
  return '<span class="tag gray">'+s+'</span>';
}
function riskTag(r){return '<span class="tag '+r+'">'+RISK_TXT[r]+'</span>';}
function bPill(b){var od=b.status==='active'&&diffDay(b.end)>0;if(od)return '<span class="pill overdue">逾期未还</span>';var m={pending:['pending','待审批'],approved:['approved','审批通过'],active:['active','使用中'],returned:['returned','已归还'],rejected:['rejected','已拒绝']};var c=m[b.status];return '<span class="pill '+c[0]+'">'+c[1]+'</span>';}

  if(cur.role==='manager'){
    db.borrows.filter(function(b){return b.status==='pending';}).forEach(function(b){list.push({t:'待审批借用单：'+b.borrowerName+' '+b.list[0].name+'（'+b.id+'）',a:"goApprove('"+qStr(b.id)+"')",at:'去审批'});});
    db.res.filter(function(r){return r.status==='pending';}).forEach(function(r){list.push({t:'待审批仪器预约：'+r.userName+' '+r.devName+'（'+r.date+'）',a:"goResApprove('"+qStr(r.id)+"')",at:'去审批'});});
    db.repairs.filter(function(r){return r.st==='待处理';}).forEach(function(r){list.push({t:'待处理报修：'+r.dev,a:"goRepair('"+qStr(r.id)+"')",at:'查看'});});
    var lows=db.items.filter(function(i){return i.status!=='报废'&&i.stock<=i.minStock&&i.minStock>0;});
    lows.forEach(function(i){list.push({t:'低库存：'+i.name+' 剩'+i.stock+i.unit,a:'goLedger()',at:'补货'});});
  }else if(cur.role==='engineer'){
    db.repairs.filter(function(r){return r.st==='待处理';}).forEach(function(r){list.push({t:'待处理报修：'+r.dev,a:"goRepair('"+qStr(r.id)+"')",at:'处理'});});
  }else if(cur.role==='borrower'){
    db.borrows.filter(function(b){return b.borrowerId===cur.id&&b.status==='pending';}).forEach(function(b){list.push({t:'申请待审批：'+b.list[0].name,a:"goRecord('"+qStr(b.id)+"')",at:'查看'});});
    db.borrows.filter(function(b){return b.borrowerId===cur.id&&b.status==='approved';}).forEach(function(b){list.push({t:'审批通过，待领用：'+b.list[0].name,a:"goRecord('"+qStr(b.id)+"')",at:'领用'});});
    db.res.filter(function(r){return r.userId===cur.id&&r.status==='pending';}).forEach(function(r){list.push({t:'仪器预约待审批：'+r.devName+' '+r.date,a:"goRes('"+qStr(r.id)+"')",at:'查看'});});
    db.res.filter(function(r){return r.userId===cur.id&&r.status==='approved';}).forEach(function(r){list.push({t:'仪器预约已通过'+(r.date<=today()?'，请扫码签到':'，待开始')+'：'+r.devName+' '+r.date,a:"goRes('"+qStr(r.id)+"')",at:r.date<=today()?'签到':'查看'});});
    db.res.filter(function(r){return r.userId===cur.id&&r.status==='using';}).forEach(function(r){list.push({t:'仪器使用中，请签退：'+r.devName,a:"goRes('"+qStr(r.id)+"')",at:'签退'});});
  }
  var body=list.length?
    '<h3>我的待办（'+list.length+'）</h3><div style="max-height:360px;overflow:auto;">'+list.map(function(x){return '<div class="sig-row"><span style="flex:1;">'+esc(x.t)+'</span><button class="btn mini primary" onclick="'+x.a+'">'+x.at+'</button></div>';}).join('')+'</div>'
    :'<h3>我的待办</h3><div class="muted" style="padding:20px;text-align:center;">暂无待办事项</div>';
  showModal(body,can());
}

function goRes(id){closeModal();navTab.borrower='records';renderShell();setTimeout(function(){openResForm(id);},40);}

function savePwd(){
  var o=document.getElementById('pw_old').value,n=document.getElementById('pw_new').value,n2=document.getElementById('pw_new2').value;
  if(o!==cur.password){document.getElementById('pw_err').textContent='当前密码错误';return;}
  if(n.length<6){document.getElementById('pw_err').textContent='新密码至少6位';return;}
  if(n!==n2){document.getElementById('pw_err').textContent='两次输入不一致';return;}
  cur.password=n;var i=db.users.findIndex(function(u){return u.id===cur.id;});db.users[i].password=n;
  logAct('修改了本人登录密码');saveDB();closeModal();toast('密码已修改');
}

/* =====================================================
   页面分发
===================================================== */
function renderPage(t){
  var el=document.getElementById('pg');if(!el)return;
  if(cur.role==='manager'){
    if(t==='ledger')el.innerHTML=vLedger();
    else if(t==='resApprove')el.innerHTML=vResApprove();
    else if(t==='approve')el.innerHTML=vApprove();
    else if(t==='violations')el.innerHTML=vViolations();
    else if(t==='waste')el.innerHTML=vWaste();
    else if(t==='repair')el.innerHTML=vRepairM();
    else el.innerHTML=vLogs();
  }else if(cur.role==='hazmat'){
    if(t==='redLedger')el.innerHTML=vRedLedger();
    else el.innerHTML=vHandover();
  }else if(cur.role==='engineer'){
    if(t==='equip')el.innerHTML=vEquip();
    else el.innerHTML=vRepairE();
  }else if(cur.role==='borrower'){
    if(t==='reserve')el.innerHTML=vReserve();
    else if(t==='apply')el.innerHTML=vApply();
    else if(t==='violations')el.innerHTML=vViolations();
    else el.innerHTML=vRecords();
  }
}

/* =====================================================
   物品详情(借用明细)弹窗 — 所有人可读
===================================================== */
function openItemDetail(id){
  var it=itemBy(id);
  var low=it.stock<=it.minStock&&it.minStock>0&&it.status!=='报废';
  var head='<h3>物品详情 — '+esc(it.name)+'</h3>'+
    '<div class="form-section"><h4>基础信息</h4>'+
    '<div class="sig-row"><b>编号：</b>'+esc(it.id)+'</div>'+
    '<div class="sig-row"><b>分类：</b>'+esc(it.cat)+'　　<b>规格型号：</b>'+esc(it.spec)+'</div>'+
    '<div class="sig-row"><b>生产厂家/批号：</b>'+esc(it.maker)+'</div>'+
    '<div class="sig-row"><b>单价：</b>¥'+it.price+'　　<b>购入日期：</b>'+esc(it.purchaseDate||'-')+'</div>'+
    '<div class="sig-row"><b>有效期/检定周期：</b>'+(it.expire||'-')+'　　<b>存放位置：</b>'+esc(it.loc)+'</div>'+
    '<div class="sig-row"><b>当前库存：</b>'+(low?'<span style="color:#e74c3c;">':'')+it.stock+' '+esc(it.unit)+(low?'（低于阈值'+it.minStock+'）</span>':'')+'　　<b>风险等级：</b>'+riskTag(it.risk)+'</div>'+
    '<div class="sig-row"><b>实时状态：</b>'+stTag(dispStatus(it))+'</div></div>';
  if(it.cat==='仪器'){
    var days=30,from=addDays(today(),-(days-1));
    var mine=db.res.filter(function(r){return r.devId===it.id&&r.date>=from&&r.date<=today()&&r.status!=='canceled'&&r.status!=='rejected';});
    var hours=mine.reduce(function(s,r){return s+r.hours;},0);
    var cap=(it.id==='YQ-002')?2:1;
    var util=hours/(days*12*cap)*100;
    var byU={};mine.forEach(function(r){byU[r.userName]=(byU[r.userName]||0)+r.hours;});
    var users=Object.keys(byU).map(function(u){return{name:u,h:byU[u]};}).sort(function(a,b){return b.h-a.h;});
    var weeks=[];
    for(var w=7;w>=0;w--){
      var s0=addDays(today(),-(w*7+6)),e0=addDays(today(),-(w*7)),h=0;
      db.res.forEach(function(r){if(r.devId===it.id&&r.date>=s0&&r.date<=e0&&r.status!=='canceled'&&r.status!=='rejected')h+=r.hours;});
      weeks.push({label:(w===0?'本周':e0.slice(5)),hours:h});
    }
    var hist=db.res.filter(function(r){return r.devId===it.id;}).sort(function(a,b){return a.date>b.date?-1:1;}).slice(0,10);
    showModal(head+
      '<div class="form-section"><h4>仪器使用数据（近30天，直观图表）</h4>'+
      '<div class="kpi-row" style="margin-bottom:10px;">'+
        '<div class="kpi"><div class="k-label">利用率</div><div class="k-val" style="font-size:26px;">'+util.toFixed(1)+'<em>%</em></div><div class="muted">机时 '+hours+'h ÷ 可用 '+(days*12*cap)+'h</div></div>'+
        '<div class="kpi"><div class="k-label">预约次数</div><div class="k-val" style="font-size:26px;">'+mine.length+'<em>次</em></div><div class="muted">近30天有效预约</div></div>'+
        '<div class="kpi"><div class="k-label">当前状态</div><div style="padding:12px 0 6px;">'+stTag(dispStatus(it))+'</div><div class="muted">'+esc(it.loc)+'</div></div>'+
      '</div>'+
      (users.length?'<div style="font-size:12.5px;color:#5a6c82;margin-bottom:2px;">谁用得最多（机时排行）</div>'+users.slice(0,3).map(function(u,i){return barRow(u.name,u.h/(users[0].h||1)*100,u.h+'h',i===0?'#6c3aa7':'#8a63c9');}).join(''):'<div class="muted" style="padding:6px 0;">近30天无使用记录'+(it.status==='待修'?'（设备待修中）':'')+'</div>')+
      '<div style="font-size:12.5px;color:#5a6c82;margin:12px 0 2px;">近8周使用趋势（小时/周）</div>'+trendChart(weeks)+
      '<div style="font-size:12.5px;color:#5a6c82;margin:14px 0 2px;">高峰时段分析（该仪器各时段预约密度）</div>'+peakHeatmap(it.id)+
      '<div style="margin-top:8px;"><button class="btn mini" onclick="openUsageDashboard(30)">查看全实验室设备对比分析 →</button></div>'+
      '</div>'+
      '<div class="form-section"><h4>预约记录明细（谁在用 / 历史留痕）</h4>'+
      (hist.length?'<table><thead><tr><th>单号</th><th>使用人</th><th>项目</th><th>日期时段</th><th>状态</th></tr></thead><tbody>'+
        hist.map(function(r){return '<tr'+(r.status==='using'&&r.date<today()?' class="row-overdue"':'')+'><td>'+esc(r.id)+'</td><td>'+esc(r.userName)+'</td><td>'+esc(r.project)+'</td><td>'+r.date+'<br><span class="muted">'+esc(r.slots.join('、'))+'</span></td><td>'+rPill(r)+'</td></tr>';}).join('')+'</tbody></table>':'<div class="muted" style="padding:14px;text-align:center;">该仪器暂无预约记录</div>')+'</div>',
      can());
    return;
  }
  var bs=db.borrows.filter(function(b){return b.list.some(function(l){return l.name===it.name;});});
  bs.sort(function(a,b){return a.createTime>b.createTime?-1:1;});
  showModal(head+
    '<div class="form-section"><h4>借用记录明细（谁在借用 / 历史留痕）</h4>'+
    (bs.length?'<table><thead><tr><th>单号</th><th>借用人</th><th>项目</th><th>数量</th><th>拟用区间</th><th>状态</th></tr></thead><tbody>'+
      bs.map(function(b){return '<tr'+(b.status==='active'&&diffDay(b.end)>0?' class="row-overdue"':'')+'><td>'+esc(b.id)+'</td><td>'+esc(b.borrowerName)+'</td><td>'+esc(b.project)+'</td><td>'+esc(b.list[0].qty)+'</td><td>'+b.start+' ~ '+b.end+'</td><td>'+bPill(b)+'</td></tr>';}).join('')+
      '</tbody></table>':'<div class="muted" style="padding:14px;text-align:center;">该物品暂无借用记录</div>')+'</div>',
    can());
}

var lf={kw:'',risk:''};
function lowBanner(){
  var lows=db.items.filter(function(i){return i.status!=='报废'&&i.stock<=i.minStock&&i.minStock>0;});
  if(!lows.length)return '';
  return '<div class="lowstock-banner">低库存预警：'+lows.map(function(i){return esc(i.name)+' 剩'+i.stock+i.unit+'（阈值'+i.minStock+i.unit+'）';}).join('；')+'</div>';
}
function vLedger(){
  var list=db.items.filter(function(i){
    if(lf.risk&&i.risk!==lf.risk)return false;
    if(lf.kw&&(i.name+i.id+i.spec+i.maker+i.loc).toLowerCase().indexOf(lf.kw.toLowerCase())<0)return false;
    return true;
  });
  return lowBanner()+
  '<div class="card"><h2>台账总览</h2><div class="sub">库存为核心数据库，全员只读实时更新 · 共 '+db.items.length+' 条 · 点击物品名称查看借用明细</div>'+
  '<div class="toolbar"><input id="lf_kw" placeholder="搜索编号/名称/型号/厂家/位置…" value="'+esc(lf.kw)+'" onkeyup="lf.kw=this.value;renderPage(\'ledger\')" style="width:260px;">'+
  '<select onchange="lf.risk=this.value;renderPage(\'ledger\')" style="width:140px;"><option value="">全部风险</option>'+['red','yellow','blue'].map(function(r){return '<option value="'+r+'"'+(lf.risk===r?' selected':'')+'>'+RISK_TXT[r]+'</option>';}).join('')+'</select>'+
  '<div class="grow"></div><button class="btn big" style="margin-right:10px;" onclick="openUsageDashboard(30)">仪器使用分析</button><button class="btn primary big" onclick="openItemWizard()">＋ 新增物品</button></div>'+
  '<table><thead><tr><th>编号</th><th>名称</th><th>分类</th><th>规格</th><th>风险</th><th>库存</th><th>实时状态</th><th>位置</th><th>有效期</th><th>操作</th></tr></thead><tbody>'+
  list.map(function(i){var low=i.stock<=i.minStock&&i.minStock>0&&i.status!=='报废';
    return '<tr><td>'+esc(i.id)+'</td><td><span class="item-name" onclick="openItemDetail(\''+i.id+'\')">'+esc(i.name)+'</span>'+(low?' <span class="lg-tag">缺</span>':'')+'</td><td>'+esc(i.cat)+'</td><td>'+esc(i.spec)+'</td><td>'+riskTag(i.risk)+'</td>'+
      '<td>'+i.stock+' '+esc(i.unit)+'</td><td>'+stTag(dispStatus(i))+'</td><td>'+esc(i.loc)+'</td><td>'+(i.expire||'-')+'</td>'+
      '<td style="white-space:nowrap;"><button class="btn mini" onclick="openEditItem(\''+i.id+'\')">编辑</button><button class="btn mini" onclick="openChangeStatus(\''+i.id+'\')">状态变更</button></td></tr>';
  }).join('')+'</tbody></table></div>';
}
/* 新增/编辑物品 */

  '<div id="'+pf+'_dual" style="display:none;" class="notice-red">红色最高风险级，出入库实行"五双"管理：<input id="'+pf+'_checker" placeholder="第二复核人账号" style="width:100%;margin-top:8px;"></div></div>';

function suggestId(){return 'NEW-'+p2(db.items.length+1)+Math.floor(Math.random()*900+100);}
function riskChanged(pf){document.getElementById(pf+'_dual').style.display=document.getElementById(pf+'_risk').value==='red'?'block':'none';}
function readItem(pf){return{name:document.getElementById(pf+'_name').value.trim(),id:document.getElementById(pf+'_id').value.trim(),cat:document.getElementById(pf+'_cat').value,spec:document.getElementById(pf+'_spec').value.trim(),maker:document.getElementById(pf+'_maker').value.trim(),price:parseFloat(document.getElementById(pf+'_price').value)||0,stock:parseFloat(document.getElementById(pf+'_stock').value)||0,unit:document.getElementById(pf+'_unit').value.trim()||'个',minStock:parseFloat(document.getElementById(pf+'_min').value)||0,loc:document.getElementById(pf+'_loc').value.trim(),purchaseDate:document.getElementById(pf+'_pd').value,expire:document.getElementById(pf+'_exp').value.trim(),risk:document.getElementById(pf+'_risk').value,checker:document.getElementById(pf+'_checker')?document.getElementById(pf+'_checker').value.trim():''};}
function openItemWizard(){wizEdit=null;showModal('<h3>新增物品 · 引导式填单</h3>'+itemForm('nw'),'<button class="btn primary" onclick="saveNewItem()">确认入库</button>'+can());}
function saveNewItem(){var it=readItem('nw');if(!it.name||!it.id){toast('请填写名称和编号','#e74c3c');return;}if(db.items.some(function(x){return x.id===it.id;})){toast('编号已存在','#e74c3c');return;}db.items.push({id:it.id,name:it.name,cat:it.cat,spec:it.spec,maker:it.maker,price:it.price,purchaseDate:it.purchaseDate,expire:it.expire,status:'正常',stock:it.stock,unit:it.unit,minStock:it.minStock,loc:it.loc,risk:it.risk});logAct('新增台账物品「'+it.id+' '+it.name+'」'+(it.risk==='red'?'，红色等级双人复核登记（复核人：'+it.checker+'）':''));saveDB();closeModal();renderShell();toast('物品已入台账');}
function openEditItem(id){var it=itemBy(id);wizEdit=id;showModal('<h3>编辑物品 — '+esc(it.name)+'</h3>'+itemForm('nw',it),'<button class="btn primary" onclick="saveEditItem()">保存修改</button>'+can());riskChanged('nw');}
function saveEditItem(){var it=readItem('nw');var i=db.items.findIndex(function(x){return x.id===wizEdit;});if(db.items.some(function(x,idx){return x.id===it.id&&idx!==i;})){toast('编号重复','#e74c3c');return;}db.items[i]=Object.assign({},db.items[i],it);logAct('编辑修改了「'+it.id+' '+it.name+'」');saveDB();closeModal();renderShell();toast('已保存并记入日志');}
/* 状态变更（报废需照片） */
var _scrapOk=false;
function openChangeStatus(id){var it=itemBy(id);_scrapOk=false;

function sig(type,done,who,when,canSign,id){
  if(done)return '<span class="sig sig-done">已签：'+esc(who)+' @ '+esc(when)+'</span>';
  if(canSign)return '<button class="btn mini primary" onclick="doSign(\''+type+'\',\''+qStr(id)+'\')">点击签名</button><span class="sig sig-pending">待签</span>';
  return '<span class="sig sig-pending">待签</span>';
}
function doSign(type,id){
  var b=db.borrows.filter(function(x){return x.id===id;})[0];
  var tm=dtStr();
  if(type==='sds'){b.sdsSigned=true;b.sdsSigner=cur.name;b.sdsSignTime=tm;b.status='pending';logAct('在借用单'+b.id+'签署借用人(安全声明)签字');}
  if(type==='admin'){b.adminOpinion='同意';b.adminSigner=cur.name;b.adminSignTime=tm;b.status='approved';logAct('审批通过借用单'+b.id+'（'+b.borrowerName+' '+b.list[0].name+'），签署领用签字','审批');}
  if(type==='ret'){b.returnSigner=cur.name;b.returnTime=tm;b.returnStatus=b.returnStatus||'完好无损';logAct('在借用单'+b.id+'签署借用人归还签字');}
  if(type==='retAdmin'){
    // 归还状态：完好无损(仪器可加回) / 正常损耗(消耗品不加) / 损坏待修
    var retOpt=(document.getElementById('ret_status')||{}).value||(b.returnStatus||'完好无损');
    b.returnAdminSigner=cur.name;b.returnTime=tm;b.returnDate=today();b.returnStatus=retOpt;b.status='returned';
    // 自动归还库存：仅"完好无损"且物品是仪器才加回（试剂/耗材/气体消耗掉）
    if(retOpt==='完好无损'){
      b.list.forEach(function(l){
        var it=db.items.find(function(i){return i.name===l.name;});
        if(!it)return;
        var num=parseFloat(String(l.qty||'0').replace(/[^\d.]/g,''));
        if(isNaN(num)||num<=0)return;
        if(it.cat==='仪器'){
          it.stock+=num;
          logAct('归还加回「'+it.id+' '+it.name+'」库存 +'+num+it.unit);
        }else{
          logAct('「'+it.id+' '+it.name+'」归还状态完好但属'+it.cat+'，不再加回库存');
        }
      });
    }else{
      logAct('借用单'+b.id+'归还状态为「'+retOpt+'」，未加回库存');
    }
    logAct('在借用单'+b.id+'签署管理员验收，单据状态→已归还');
  }
  saveDB();closeModal();openBorrowForm(b.id);
}
function confirmPickup(id){
  var b=db.borrows.filter(function(x){return x.id===id;})[0];
  b.status='active';b.handoverNote=b.handoverNote||'借用人已确认领取出库';
  // 自动扣减库存：按 name+spec 匹配 db.items，从 qty 字符串里提取数字
  b.list.forEach(function(l){
    var it=db.items.find(function(i){return i.name===l.name;});
    if(!it)return;
    var num=parseFloat(String(l.qty||'0').replace(/[^\d.]/g,''));
    if(isNaN(num)||num<=0)return;
    if(it.stock<num){toast('⚠ '+it.name+' 库存不足（有'+it.stock+'，需'+num+'）','#e74c3c');}
    it.stock=Math.max(0,it.stock-num);
    logAct('出库扣减「'+it.id+' '+it.name+'」库存 -'+num+it.unit);
  });
  logAct('借用人 '+b.borrowerName+' 确认领取借用单 '+b.id+'，状态→使用中');
  saveDB();closeModal();openBorrowForm(id);
}

function qrSvg(data){
  var n=21,cells=[];var hash=0;for(var i=0;i<data.length;i++)hash=(hash*31+data.charCodeAt(i))>>>0;
  for(var i=0;i<n*n;i++){hash=(hash*1103515245+12345)>>>0;cells.push(((hash>>8)&1)===0);}
  function pat(x,y){return ((x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13))&&(x===0||x===6||y===0||y===6||x===14||x===20||y===14||y===20||(x>=2&&x<=4&&y>=2&&y<=4)||(x>=16&&x<=18&&y>=2&&y<=4)||(x>=2&&x<=4&&y>=16&&y<=18));}
  var rects=[];var cx=2,cy=2;
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){if(pat(x,y)||cells[y*n+x])rects.push('<rect x="'+(cx+x)+'" y="'+(cy+y)+'" width="1" height="1" fill="#12395f"/>');}
  return '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 25 25" style="background:#fff;border:1px solid #e3e9f1;border-radius:6px;">'+rects.join('')+'</svg>';
}

function doResSign(id,act){
  var r=resById(id);
  var opEl=document.getElementById('rs_op');
  var op=opEl?opEl.value.trim():'';
  if(act==='approve'){r.adminOpinion='同意';if(op)r.adminReason=op;r.approveSigner=cur.name;r.approveTime=dtStr();r.status='approved';logAct('审批通过仪器预约 '+r.id+'（'+r.userName+' '+r.devName+' '+r.date+'）','审批');}
  if(act==='reject'){if(!op){toast('拒绝必须填写原因','#e74c3c');return;}r.adminOpinion='拒绝';r.adminReason=op;r.approveSigner=cur.name;r.approveTime=dtStr();r.status='rejected';logAct('拒绝了仪器预约 '+r.id+'，原因：'+op,'审批');}
  if(act==='in'){
    r.status='using';r.checkinTime=dtStr();
    var now=new Date(),startH=8,endH=22;
    var slotH=r.slots.map(function(s){return parseInt(s.match(/\d+/)[0]);});
    var inSlot=slotH.some(function(h){return now.getHours()>=h&&now.getHours()<h+4;});
    if(!inSlot&&r.date<=today()){
      var vtype=now.getHours()<Math.min.apply(null,slotH)?'提前签到':'迟到超过预约时段';
      db.violations.unshift({id:'WG'+today().replace(/-/g,'')+Math.floor(Math.random()*900+100)+1000,
        resId:r.id,userId:r.userId,userName:r.userName,devName:r.devName,devId:r.devId,
        project:r.project,date:r.date,violationType:vtype,
        description:'签到时间 '+dtStr()+' 不在预约时段内（'+r.slots.join('、')+'）',
        status:'待处理',handleResult:'',handleTime:'',handleBy:''});
      logAct('违规登记：'+r.userName+' '+r.devName+' '+vtype,'违规');
      toast('已签到，但因不在预约时段内被标记为违规','#e74c3c');
    }
    logAct('仪器扫码签到：'+r.userName+' 开始使用 '+r.devName+'（'+r.id+'）');
  }
  if(act==='out'){
    r.status='done';r.checkoutTime=dtStr();var sh=1;var a=new Date(r.checkinTime.replace(' ','T')),b=new Date(r.checkoutTime.replace(' ','T'));sh=Math.max(1,Math.round((b-a)/3600000));r.actualHours=sh;logAct('仪器签退：'+r.devName+' 使用 '+sh+' 小时（'+r.id+'）');
  }
  saveDB();closeModal();renderShell();
  if(cur.role==='borrower')setTimeout(function(){openResForm(id);},30);
}

function resStats(days){
  var from=addDays(today(),-(days-1));
  var rs=db.res.filter(function(r){return r.date>=from&&r.date<=today()&&(r.status==='done'||r.status==='using'||r.status==='approved');});
  var byDev={};
  db.items.filter(function(i){return i.cat==='仪器';}).forEach(function(i){byDev[i.id]={name:i.name,status:i.status,hours:0,count:0,cap:(i.id==='YQ-002'?2:1),users:{}};});
  rs.forEach(function(r){var b=byDev[r.devId];if(!b)return;b.hours+=r.hours;b.count++;b.users[r.userName]=(b.users[r.userName]||0)+r.hours;});
  var avail=days*12;
  var list=Object.keys(byDev).map(function(id){var b=byDev[id];return{id:id,name:b.name,status:b.status,util:b.hours/(avail*b.cap)*100,hours:b.hours,count:b.count,users:b.users};});
  list.sort(function(a,b){return b.util-a.util;});
  var byU={};rs.forEach(function(r){byU[r.userName]=(byU[r.userName]||0)+r.hours;});
  var users=Object.keys(byU).map(function(u){return{name:u,hours:byU[u]};}).sort(function(a,b){return b.hours-a.hours;});
  var weeks=[];
  for(var w=7;w>=0;w--){
    var s0=addDays(today(),-(w*7+6)),e0=addDays(today(),-(w*7)),h=0,c=0;
    rs.forEach(function(r){if(r.date>=s0&&r.date<=e0){h+=r.hours;c++;}});
    weeks.push({label:(w===0?'本周':e0.slice(5)),hours:h,count:c});
  }
  return {list:list,users:users,weeks:weeks,total:rs.length,hours:rs.reduce(function(s,r){return s+r.hours;},0)};
}

function weeklyLineChart(){
  var days=[],todayD=new Date();
  for(var d=6;d>=0;d--){var dt=new Date(todayD);dt.setDate(dt.getDate()-d);days.push(dt.toISOString().slice(0,10));}
  var byDay={};
  days.forEach(function(dt){
    var a=db.res.filter(function(r){return r.date===dt&&(r.status==='done'||r.status==='using'||r.status==='approved');});
    var act=db.res.filter(function(r){return r.date===dt&&(r.status==='done'||r.status==='using');});
    byDay[dt]={total:a.length,actual:act.length,label:dt.slice(5)};
  });
  var max=Math.max(1,days.reduce(function(s,d){return Math.max(s,byDay[d].total,byDay[d].actual);},0));
  var W=520,H=160,pad={l:36,r:14,t:10,b:28},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  function pts(key){return days.map(function(d,i){var x=pad.l+(i/(days.length-1))*cw,y=pad.t+ch-(byDay[d][key]/max*ch*0.88);return x+','+y;}).join(' ');}
  var yTicks=[];for(var t=0;t<=4;t++){var v=Math.round(max*t/4);var y=pad.t+ch-(v/max*ch*0.88);yTicks.push('<line x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'" stroke="#eef2f7"/><text x="'+(pad.l-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#94a2b5">'+v+'</text>');}
  var legend='<div style="display:flex;gap:18px;font-size:11.5px;color:#41546d;margin-bottom:6px;"><span><span style="display:inline-block;width:14px;height:3px;background:#2a78b8;vertical-align:middle;margin-right:4px;"></span>预约次数</span><span><span style="display:inline-block;width:14px;height:3px;background:#27ae60;vertical-align:middle;margin-right:4px;"></span>实际使用次数</span></div>';
  var p1='<polyline fill="none" stroke="#2a78b8" stroke-width="2.2" points="'+pts('total')+'"/>';
  var p2='<polyline fill="none" stroke="#27ae60" stroke-width="2.2" points="'+pts('actual')+'"/>';
  var dots=[];
  days.forEach(function(d,i){['total','actual'].forEach(function(k){
    var x=pad.l+(i/(days.length-1))*cw,y=pad.t+ch-(byDay[d][k]/max*ch*0.88),col=k==='total'?'#2a78b8':'#27ae60';
    dots.push('<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+col+'"/>');
  });});
  var xLabels=days.map(function(d,i){var x=pad.l+(i/(days.length-1))*cw;return '<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="#94a2b5">'+byDay[d].label+'</text>';}).join('');
  return legend+'<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+yTicks.join('')+p1+p2+dots.join('')+xLabels+'</svg>';
}
function peakHeatmap(devId){
  var days=['周一','周二','周三','周四','周五','周六','周日'];
  var slotNames=['上午 8:00-12:00','下午 13:00-17:00','晚上 18:00-22:00'];
  var slotLabels=['8:00-12:00','13:00-17:00','18:00-22:00'];
  // 3行7列：按 星期×时段 聚合计数
  var grid=[];
  for(var r=0;r<3;r++){grid.push([]);for(var c=0;c<7;c++){grid[r].push(0);}}
  db.res.forEach(function(r){
    if(devId&&r.devId!==devId)return;
    var d=new Date(r.date);var wd=(d.getDay()+6)%7; // 0=周一
    if(isNaN(wd)||!r.slots)return;
    r.slots.forEach(function(s){
      for(var si=0;si<3;si++){if(s===slotNames[si]){grid[si][wd]++;break;}}
    });
  });
  // 每次预约颜色加深一档：0=极浅，1-2=浅蓝，3-4=中蓝，5+=深蓝
  function shade(cnt){
    if(cnt<=0)return '#f0f4f9';
    if(cnt<=2)return '#bcd6f0';
    if(cnt<=4)return '#6fa6da';
    if(cnt<=6)return '#3d85c4';
    return '#1a5d9e';
  }
  function txtColor(cnt){return cnt>=3?'#fff':'#3a4a5e';}
  var cellW=78,cellH=42,timeW=92,topH=26,rowG=4;
  var W=timeW+7*cellW+10,H=topH+3*(cellH+rowG)+6;
  // 星期头
  var heads=days.map(function(d,i){return '<text x="'+(timeW+i*cellW+cellW/2)+'" y="'+(topH-8)+'" text-anchor="middle" font-size="12" fill="#41546d" font-weight="600">'+d+'</text>';}).join('');
  // 画格子
  var cells=[];
  for(var r=0;r<3;r++){
    var y=topH+r*(cellH+rowG);
    cells.push('<text x="'+(timeW-10)+'" y="'+(y+cellH/2+4)+'" text-anchor="end" font-size="11.5" fill="#41546d">'+slotLabels[r]+'</text>');
    for(var c=0;c<7;c++){
      var x=timeW+c*cellW,cnt=grid[r][c];
      cells.push('<rect x="'+x+'" y="'+y+'" width="'+(cellW-4)+'" height="'+cellH+'" rx="6" ry="6" fill="'+shade(cnt)+'" stroke="#d8e2ee" stroke-width="1">');
      cells.push('<title>'+days[c]+' '+slotLabels[r]+'：'+cnt+'次预约</title>');
      cells.push('</rect>');
      if(cnt>0){
        cells.push('<text x="'+(x+(cellW-4)/2)+'" y="'+(y+cellH/2+5)+'" text-anchor="middle" font-size="15" fill="'+txtColor(cnt)+'" font-weight="bold">'+cnt+'</text>');
      }
    }
  }
  // 图例：颜色从浅到深
  var legend='<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#41546d;margin-bottom:8px;">少'+
    ['<span style="display:inline-block;width:18px;height:12px;border-radius:3px;background:#f0f4f9;border:1px solid #d8e2ee;"></span>',
     '<span style="display:inline-block;width:18px;height:12px;border-radius:3px;background:#bcd6f0;"></span>',
     '<span style="display:inline-block;width:18px;height:12px;border-radius:3px;background:#6fa6da;"></span>',
     '<span style="display:inline-block;width:18px;height:12px;border-radius:3px;background:#3d85c4;"></span>',
     '<span style="display:inline-block;width:18px;height:12px;border-radius:3px;background:#1a5d9e;"></span>'].join('')+
    '多　<span class="muted">每记录一次预约，对应时间方块加深一档</span></div>';
  return legend+'<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+heads+cells.join('')+'</svg>';
}

    }).join('')||'<div class="muted">暂无数据</div>')+

  showModal('<h3>仪器使用分析</h3>'+body,can());

  var bid='BR'+today().replace(/-/g,'')+Math.floor(Math.random()*900+100);
  db.borrows.unshift({id:bid,borrowerId:cur.id,borrowerName:cur.name,project:proj,start:s,end:e,list:[{name:it.name,spec:it.spec,qty:q}],sdsSigned:true,sdsSignTime:dtStr(),sdsSigner:cur.name,adminOpinion:'',adminReason:'',adminSigner:'',adminSignTime:'',handoverNote:'',returnDate:'',returnStatus:'',returnSigner:'',returnAdminSigner:'',returnTime:'',status:'pending',createTime:dtStr()});
  logAct('提交借用申请：'+it.name+' '+q+'（'+s+' 至 '+e+'），项目：'+proj+'，已签署安全声明');_applySigned=false;
  saveDB();toast('申请已提交，等待管理员审批');document.getElementById('ap_form').innerHTML='';navTab.borrower='records';renderShell();
}
var _recFilter='all';
function vRecords(){
  var chips=[['all','全部'],['res','仪器预约'],['bor','试剂借用']];
  var rows=[];
  if(_recFilter!=='bor')db.res.forEach(function(r){rows.push({t:'res',d:r});});
  if(_recFilter!=='res')db.borrows.forEach(function(b){rows.push({t:'bor',d:b});});
  rows.sort(function(a,b){var ta=a.t==='res'?a.d.applyTime:a.d.createTime,tb=b.t==='res'?b.d.applyTime:b.d.createTime;return ta>tb?-1:(ta<tb?1:0);});
  return '<div class="card"><h2>借用 / 预约记录</h2><div class="sub">全部记录（含他人）· 含审批通过状态 · 我的单据蓝色高亮 · 逾期红色</div>'+
  '<div class="toolbar">'+chips.map(function(c){return '<button class="btn '+(_recFilter===c[0]?'primary':'')+'" style="padding:5px 14px;" onclick="_recFilter=\''+c[0]+'\';renderPage(\'records\')">'+c[1]+'</button>';}).join('')+'</div>'+
  '<table><thead><tr><th>单号</th><th>类型</th><th>借用人</th><th>物品</th><th>项目</th><th>时间</th><th>状态</th><th></th></tr></thead><tbody>'+
  rows.map(function(x){
    if(x.t==='res'){
      var r=x.d,mine=r.userId===cur.id,od=r.status==='using'&&r.date<today();
      return '<tr'+(mine?' style="background:#f0f7ff;"':'')+(od?' class="row-overdue"':'')+'><td>'+esc(r.id)+'</td><td><span class="tag borrowing">仪器预约</span></td><td>'+esc(r.userName)+(mine?' (我)':'')+'</td><td>'+esc(r.devName)+'</td><td>'+esc(r.project)+'</td><td>'+r.date+'<br><span class="muted">'+esc(r.slots.join('、'))+'</span></td><td>'+rPill(r)+'</td><td><button class="btn mini" onclick="openResForm(\''+r.id+'\')">查看预约表</button></td></tr>';
    }
    var b=x.d,mine=b.borrowerId===cur.id,od=b.status==='active'&&diffDay(b.end)>0;
    return '<tr'+(mine?' style="background:#f0f7ff;"':'')+(od?' class="row-overdue"':'')+'><td>'+esc(b.id)+'</td><td><span class="tag blue">试剂借用</span></td><td>'+esc(b.borrowerName)+(mine?' (我)':'')+'</td><td>'+esc(b.list[0].name)+' '+esc(b.list[0].qty)+'</td><td>'+esc(b.project)+'</td><td>'+b.start+' ~ '+b.end+'</td><td>'+bPill(b)+'</td><td><button class="btn mini" onclick="openBorrowForm(\''+b.id+'\')">查看申请表</button></td></tr>';
  }).join('')+'</tbody></table></div>';
}

route();
</script>
